  reason: no-developer-program
  detail: >-
    Fintech Farm sells bank partnerships, not API access — it builds and operates
    a neobank jointly with a licensed local bank — so there is no developer
    portal, no API reference and no API host at all: api.fintech-farm.com,
    developers.fintech-farm.com and docs.fintech-farm.com are all NXDOMAIN, and
    the only non-public surface, dev.fintech-farm.com, answers HTTP 401 behind
    HTTP Basic auth.
