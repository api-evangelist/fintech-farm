aid: fintech-farm
name: Fintech Farm
description: 'Fintech Farm is a London-based fintech company that builds and operates
  credit-led digital banks (neobanks) in emerging markets in partnership with licensed
  local banks. Founded in 2020 by Dmytro Dubilet (co-founder of Monobank), Nick Bezkrovnyy
  and Oleksandr Vityaz, the company supplies an end-to-end stack — mobile banking apps,
  an AI-driven credit engine and credit-risk models, customer acquisition and retention
  programs, and customer service operations — and is compensated on the performance
  of the resulting bank. Its launches include Leobank in Azerbaijan, Liobank in Vietnam,
  Simbank with DosCredoBank in Kyrgyzstan, Roarbank with Unity Bank in India, Tez with
  Hamkorbank in Uzbekistan, and Credit+ in Morocco. Fintech Farm is a business-to-business
  bank-partnership provider and publishes no public developer program, API documentation
  or machine-readable API contract; its integration surface is delivered privately to
  partner banks.'
